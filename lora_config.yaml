# Every value here was measured, not inherited. See README for the numbers.
model: ./gemma-mlx-4bit
train: true
data: ./re_data_all
adapter_path: ./adapters
fine_tune_type: lora
optimizer: adam

# 42 = every text layer in this model; mlx_lm's default of 16 left the bottom
# two thirds frozen. Going 16 -> 42 costs 1.7x wall time and is where nearly all
# the slowdown lives - rank is close to free afterwards, so it is set high:
# rank 8 -> 64 added 1.4GB and 0.004 it/s for 22x the trainable parameters.
num_layers: 42
lora_parameters:
  rank: 64
  # mlx_lm multiplies the adapter output by `scale` directly - it is not
  # alpha/rank. Its 20.0 default is therefore tied to rank 8; keeping 20.0 at
  # rank 64 would have scaled every update up eightfold. 2.0 is alpha 128.
  scale: 2.0
  dropout: 0.0   # one pass over 127k samples never repeats a sample; nothing to regularize

batch_size: 2          # 18.4GB peak of 32GB at rank 64/42 layers, measured
max_seq_length: 2048
mask_prompt: true
grad_checkpoint: true
iters: 63573           # one epoch: 127147 rows / batch 2

# 1e-4 - the value this repo used to carry - diverges at this capacity: val loss
# climbed 2.511 -> 5.205 over 150 iters. 3e-5 reached 0.867 and 1e-5 reached
# 0.892, so 3e-5 it is, with warmup so the first steps cannot blow up and decay
# so the last ones stop bouncing.
learning_rate: 3e-5
lr_schedule:
  name: cosine_decay
  arguments: [3e-5, 63573, 3e-6]
  warmup: 200
  warmup_init: 1e-7

# 25 batches was 50 samples out of 20k - too noisy to conclude anything from.
val_batches: 100
steps_per_eval: 2000
steps_per_report: 10
save_every: 500        # ~55 min of work at 0.15 it/s; train_re.sh prunes old ones
seed: 0
